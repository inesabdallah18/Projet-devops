apiVersion: apps/v1
kind: Deployment
metadata:
  name: tpfoyer-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tpfoyer
  template:
    metadata:
      labels:
        app: tpfoyer
    spec:
      imagePullSecrets:
        - name: nexus-pull-secret
      containers:
      - name: app
        image: tpfoyer-17:59   # ← dispo via reseau externe de kuber
        ports:
        - containerPort: 8080
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "200m"
            memory: "256Mi"