apiVersion: apps/v1
kind: Deployment
metadata:
  name: tpfoyer-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tpfoyer
  template:
    metadata:
      labels:
        app: tpfoyer
    spec:
      imagePullSecrets:
        - name: nexus-pull-secret   # ← AJOUTE CETTE LIGNE ICI
      containers:
      - name: app
        image: 172.30.95.2:8082/tpfoyer-17:59
        ports:
        - containerPort: 8080
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "200m"
            memory: "256Mi"