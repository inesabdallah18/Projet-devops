apiVersion: apps/v1
kind: Deployment
metadata:
  name: tpfoyer-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tpfoyer
  template:
    metadata:
      labels:
        app: tpfoyer
    spec:
      containers:
      - name: app
        image: 172.30.95.2:8082/docker-hosted/tpfoyer-17:TAG_PLACEHOLDER   # ← remplacé automatiquement par le pipeline
        ports:
        - containerPort: 8080   # port de ton Spring Boot
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "200m"
            memory: "256Mi"