# Configuration pour les tests : base H2 en mémoire (pas de MySQL)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Dialect Hibernate pour H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Crée ou met à jour les tables automatiquement pendant les tests
spring.jpa.hibernate.ddl-auto=update

# Désactive Flyway/Liquibase si tu en utilises (optionnel)
spring.flyway.enabled=false
spring.liquibase.enabled=false

# Optionnel : affiche les logs SQL pour debugger
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true