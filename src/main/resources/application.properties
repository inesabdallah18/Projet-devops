# ================================================
# CONFIGURATION SERVEUR
# ================================================
server.servlet.context-path=/tpFoyer17
server.port=8082


# ================================================
# CONFIGURATION DATABASE - POUR DOCKER
# ================================================

# URL JDBC correcte pour Docker (nom du container MySQL = mysql-db)
spring.datasource.url=jdbc:mysql://mysql-db:3306/foyerdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC

# Identifiants exacts passés dans docker run -e
spring.datasource.username=root
spring.datasource.password=root

# Driver MySQL (doit être présent dans pom.xml)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ================================================
# CONFIGURATION JPA / HIBERNATE
# ================================================
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update           
spring.jpa.show-sql=true                      
spring.jpa.properties.hibernate.format_sql=true


# ================================================
# LOGGING SUPPLÉMENTAIRE (très utile pour debug connexion BDD)
# ================================================
logging.level.org.springframework.jdbc=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.com.zaxxer.hikari=DEBUG